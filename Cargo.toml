[package]
name = "spvisualizer"
version = "0.1.0"
edition = "2024"

[dependencies]
orchard = { version = "0.15", default-features = false, features = ["unstable-frost", "test-dependencies"] }
hex = "0.4"
bip39 = "2.0"
subtle = "2.6"
zcash_primitives = "0.30"
zcash_keys = { version = "0.15", features = ["test-dependencies", "unstable", "orchard", "sapling", "transparent-inputs"] }
zcash_protocol = { version = "0.10", features = ["local-consensus"] }
zcash_address = "0.13"
zip32 = "0.2"
blake2b_simd = "1.0"
pasta_curves = "0.5"
bech32 = "0.11"
qrcode = { version = "0.14", default-features = false }